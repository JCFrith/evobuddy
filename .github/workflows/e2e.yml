name: E2E (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  e2e:
    name: Playwright end-to-end tests
    runs-on: ubuntu-latest
    # Requires a real (Preview-branch or dedicated CI) Supabase project --
    # see the "Supabase Environment Isolation" section of CLAUDE.md.
    # Without these secrets configured, this job is a documented no-op
    # rather than a false-red build.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check Supabase test credentials are configured
        id: creds
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Playwright end-to-end tests
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3100"
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AUTH_ALIAS_SECRET: ${{ secrets.AUTH_ALIAS_SECRET }}
          RECOVERY_CODE_SECRET: ${{ secrets.RECOVERY_CODE_SECRET }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
        run: npm run test:e2e

      - name: Skipped (no test Supabase project configured)
        if: steps.creds.outputs.configured != 'true'
        run: echo "Add NEXT_PUBLIC_SUPABASE_URL and friends as repo secrets (pointing at a non-production Supabase project) to enable this job."

      - uses: actions/upload-artifact@v7
        if: always() && steps.creds.outputs.configured == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
